<script type="application/ld+json">{"@context": "https://schema.org", "@type": "ScholarlyArticle", "headline": "Algebraic World Model: From Observations to Axioms and Proofs", "abstract": "AI has made remarkable progress in mathematics, solving challenging problems with machine-checkable proofs in Lean, yet typically relying on predefined mathematical definitions and formal specifications. This raises a natural question: can it reason rigorously about an unknown world? We introduce the Algebraic World Model (AWM), which turns interaction with an unfamiliar environment into a mathematical model of it. The agent explores the environment and prototypes executable hypotheses, revising them through each transition. It then structures these hypotheses into typed objects and shared rules, simplifies them through category-theory-inspired transformations, and formalizes the resulting model in Lean 4 to prove reachability and impossibility. On two impossible game levels, AWM agents construct closed, kernel-checked Lean proofs that exclude every legal winning sequence under explicit learned models in all six runs. Without AWM, Claude Opus 5.5 and GPT-6 Astra produce no such certificates in twelve runs; even the sole numerically correct bound leaves route minimality as an explicit, unchecked assumption. AWM also substantially improves bound accuracy to 4/6, compared with 1/6 for Opus 5.5 and 0/6 for GPT-6 Astra, and reaches 100% across the six runs after feedback-guided repair. AWM also models all 25 public ARC-AGI-3 games: Lean replays the winning runs of all 183 levels, and with Opus 5 it scores 99.9 with the fewest certified actions among the systems that report them.", "author": {"@type": "Person", "name": "Anonymous"}, "url": "https://ephemeral6.github.io/awm-site/", "image": "https://ephemeral6.github.io/awm-site/og.png", "encoding": {"@type": "MediaObject", "contentUrl": "https://ephemeral6.github.io/awm-site/paper.pdf", "encodingFormat": "application/pdf"}}</script>

/* AWM site. Every colour is a token on :root; dark values are defined twice below (system preference and explicit choice). */
:root {
  --bg: #f6f4ee; --panel: #fffdf8; --panel2: #efece3; --line: #dcd6c8;
  --ink: #1c1d21; --dim: #575c66; --faint: #8a8d94;
  --accent: #1d4c9c; --accent-ink: #ffffff; --warm: #c45a12;
  --ok: #2b7a46; --bad: #b1322a; --warn: #a8670f; --con: #1d4c9c; --ms: #2b7a46;
  --chip: #ebe7dc; --code-bg: #f1eee6; --changed: #f0a500; --mark: #fff1c2;
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131519; --panel: #1a1d22; --panel2: #20242a; --line: #30353d;
    --ink: #e7e5df; --dim: #a7abb3; --faint: #727780;
    --accent: #8fb0f2; --accent-ink: #0e1220; --warm: #f0a05a;
    --ok: #63c48a; --bad: #f07a70; --warn: #e3ab55; --con: #8fb0f2; --ms: #63c48a;
    --chip: #262a31; --code-bg: #181b20; --changed: #ffd34d; --mark: #3a3420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131519; --panel: #1a1d22; --panel2: #20242a; --line: #30353d;
  --ink: #e7e5df; --dim: #a7abb3; --faint: #727780;
  --accent: #8fb0f2; --accent-ink: #0e1220; --warm: #f0a05a;
  --ok: #63c48a; --bad: #f07a70; --warn: #e3ab55; --con: #8fb0f2; --ms: #63c48a;
  --chip: #262a31; --code-bg: #181b20; --changed: #ffd34d; --mark: #3a3420;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); font-size: 13px; }
code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
      overflow: auto; max-height: 620px; line-height: 1.5; margin: 8px 0; }
pre code { background: none; padding: 0; }
img, canvas, svg { max-width: 100%; }
summary, .note, .lede, td, th { overflow-wrap: anywhere; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .in { max-width: 1240px; margin: 0 auto; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.topbar .brand { font: 600 15px var(--serif); color: var(--ink); letter-spacing: .2px; }
.topbar nav { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.topbar nav a { color: var(--dim); }
.topbar nav a.on { color: var(--ink); font-weight: 600; }
.topbar .sp { flex: 1; }
.topbar button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 2px 8px; cursor: pointer; font: 13px var(--sans); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font: 600 38px/1.18 var(--serif); margin: 14px 0 10px; letter-spacing: -.2px; }
h2 { font: 600 25px/1.3 var(--serif); margin: 40px 0 10px; }
h3 { font: 600 18px/1.35 var(--serif); margin: 24px 0 8px; }
h4 { font: 600 13px var(--sans); color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 6px; }
p { margin: 8px 0 12px; }
.lede { font: 19px/1.55 var(--serif); color: var(--dim); max-width: 760px; }
.muted, .note { color: var(--dim); font-size: 14px; }
.crumb { font-size: 13px; color: var(--dim); }
.kicker { font: 600 12px var(--sans); letter-spacing: 1.4px; text-transform: uppercase; color: var(--warm); }

.btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.btn { display: inline-block; padding: 6px 13px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel);
       color: var(--ink); font: 14px var(--sans); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:hover { text-decoration: none; border-color: var(--accent); }

/* hero: text | Figure 1 on wide screens, the tiles below both; on phones text, tiles, figure */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-areas: "text fig" "stats stats";
        gap: 8px 32px; align-items: center; padding: 12px 0 8px; }
.hero .h-text { grid-area: text; } .hero .h-fig { grid-area: fig; } .hero .h-stats { grid-area: stats; }
.authors { color: var(--dim); font-size: 15px; margin: 0 0 8px; }
.tldr { font: 16px/1.55 var(--sans); background: var(--panel); border-left: 3px solid var(--accent); padding: 8px 12px; margin: 10px 0; max-width: 760px; }
.teaser { margin: 0; }
.teaser svg { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
.teaser .t-dim { fill: #f6f4ee; opacity: .78; }
.teaser .t-ring { fill: none; stroke: var(--warm); stroke-width: 1.6; }
.teaser figcaption { min-height: 4.6em; }
.teaser figcaption .note { display: block; margin-top: 4px; }
.t-ctrl { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.t-ctrl .btn { padding: 2px 10px; font-size: 13px; }
.t-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--faint); background: none; padding: 0; margin-right: 4px; cursor: pointer; }
.t-dot.on { background: var(--warm); border-color: var(--warm); }
.capw { margin: 16px 0; font-family: var(--sans); }
.capw table.t td, .capw table.t th { font-size: 14px; }
svg.merge { width: 100%; height: auto; display: block; font-family: var(--mono); }
svg.merge .nm, svg.merge .lb { fill: var(--dim); font-size: 11px; }
svg.merge .ax { stroke: var(--line); }
svg.merge .life { stroke: var(--line); stroke-width: 2; }
svg.merge .v { fill: var(--accent); }
svg.merge a .v:hover { fill: var(--warm); }
svg.merge .x { fill: var(--bad); font-size: 14px; font-weight: 600; }
svg.merge .to { fill: none; stroke: var(--faint); stroke-width: 1; }
svg.merge .rule { fill: var(--ink); font-size: 13px; font-weight: 600; }
.hero figure { margin: 0; }
.hero .cvwrap { position: relative; aspect-ratio: 1; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.hero canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.hero figcaption { font-size: 13px; color: var(--dim); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; margin: 24px 0 8px;
         border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 12px 14px 12px 0; }
.stat .v { font: 600 28px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.stat .k { font-weight: 600; font-size: 14px; }
.stat p { color: var(--dim); font-size: 13px; margin: 4px 0 0; }

/* paper */
.paperwrap { display: grid; grid-template-columns: 220px minmax(0, 760px); gap: 40px; justify-content: center; }
.toc { position: sticky; top: 64px; align-self: start; font-size: 13.5px; max-height: calc(100vh - 80px); overflow: auto; padding-top: 44px; }
.toc a { display: block; padding: 3px 0; color: var(--dim); }
.toc a:hover { color: var(--accent); }
.paper { font: 17.5px/1.72 var(--serif); overflow-wrap: anywhere; min-width: 0; }
.paper h2 { font-size: 26px; border-top: 1px solid var(--line); padding-top: 22px; }
.paper h3 { font-size: 19px; }
.paper figure { margin: 22px 0; text-align: center; }
.paper figure img { max-width: 100%; background: #fff; border-radius: 3px; }
.paper figcaption { font: 15px/1.5 var(--serif); color: var(--dim); text-align: left; margin-top: 8px; }
.paper table { border-collapse: collapse; margin: 14px auto; font: 14px var(--sans); display: block; overflow-x: auto; max-width: 100%; width: max-content; }
.paper td, .paper th { border-bottom: 1px solid var(--line); padding: 4px 9px; }
.paper mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
.paper mjx-container:not([display="true"]) { display: inline-block; vertical-align: middle; }
.nobr { white-space: nowrap; }
.paper mjx-container[display="true"] { display: block !important; min-width: 0 !important; overflow-x: auto !important; }
.paper a.game, .paper a[href^="#"]:not([href^="#paper"]) { font-family: var(--mono); font-size: .88em; }
.bib { font-size: 15px; } .bib p { margin: 6px 0; }

/* explore card inserted into the paper */
.explore { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; margin: 14px 0 22px;
           padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warm);
           border-radius: 4px; font: 14px/1.5 var(--sans); }
.explore img { width: 96px; height: 96px; image-rendering: pixelated; display: block; border-radius: 2px; background: #000; }
.explore b { font-family: var(--mono); }
.paper .explore a { font-family: var(--sans); font-size: 14px; }
.explore .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }

/* gallery and tables */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.gcard { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; color: var(--ink); display: block; }
.gcard:hover { border-color: var(--accent); text-decoration: none; }
.gcard img { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: #000; }
.gcard .t { padding: 7px 9px; }
.gcard .t b { font-family: var(--mono); font-size: 15px; }
.gcard .t span { display: block; color: var(--dim); font-size: 12px; }
.chip { display: inline-block; background: var(--chip); color: var(--dim); border-radius: 3px; padding: 0 7px; font-size: 12px;
        margin: 2px 4px 2px 0; white-space: nowrap; font-family: var(--sans); }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.con { color: var(--con); }
a.chip:hover { text-decoration: none; border: 0; filter: brightness(.96); }
.tbox { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); margin: 10px 0; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.t th { background: var(--panel2); font-weight: 600; }
table.t td.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
table.t tr:last-child td { border-bottom: none; }

/* expandable */
details.item { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin: 8px 0; }
details.item > summary { cursor: pointer; padding: 9px 13px; list-style: none; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::before { content: "\25B8"; color: var(--faint); margin-right: 8px; }
details.item[open] > summary::before { content: "\25BE"; }
details.item .body { padding: 0 13px 12px; }
details.item .name { font-family: var(--mono); font-weight: 600; }
details.orig { margin: 4px 0 8px; font-size: 13px; color: var(--dim); }
details.orig > summary { cursor: pointer; color: var(--faint); font-size: 12px; }
details.orig > div { white-space: pre-wrap; padding: 6px 0 0; }
.claim { font: 16px/1.55 var(--serif); }
.vers { border-left: 2px solid var(--line); margin: 8px 0 8px 4px; padding-left: 12px; }
.vers .v { margin: 10px 0; }
.vers .v .h { font-size: 12px; color: var(--dim); }
.prose { max-width: 780px; }
.md { font: 16.5px/1.65 var(--serif); }
.md h1 { font-size: 24px; } .md h2 { font-size: 20px; margin-top: 26px; } .md h3 { font-size: 17px; }
.md ul { padding-left: 22px; }
.pipeline { width: 100%; max-width: 980px; display: block; margin: 8px 0; }
.pipeline .box { fill: var(--panel); stroke: var(--line); }
.pipeline .hd { fill: var(--ink); font: 600 15px var(--sans); }
.pipeline .sb { fill: var(--dim); font: 12.5px var(--sans); }
.pipeline .ar { stroke: var(--faint); stroke-width: 1.6; fill: none; }
.pipeline .ah { fill: var(--faint); }
footer.site { border-top: 1px solid var(--line); margin-top: 52px; padding-top: 12px; color: var(--dim); font-size: 13px; }
footer.site ul { padding-left: 18px; margin: 6px 0; }
.wb-frame { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
.pv-list { display: flex; flex-wrap: wrap; gap: 4px; }

/* replay */
.rp { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.rp .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rp figure { margin: 0; }
.rp figcaption { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
.cv { position: relative; width: 100%; aspect-ratio: 1; background: #000; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.ctrl button, .ctrl select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
                             padding: 4px 10px; font: 13px var(--sans); cursor: pointer; }
.ctrl button:hover { border-color: var(--accent); }
.ctrl input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.ctrl label { font-size: 13px; color: var(--dim); }
.strip { width: 100%; height: 34px; display: block; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; background: var(--panel2); }
.legend { font-size: 12px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 11px 13px; margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 14px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.bet { white-space: pre-wrap; font: 15px/1.55 var(--serif); }
.lines { list-style: none; margin: 8px 0 0; padding: 0; max-height: 420px; overflow: auto; font-size: 13px; }
.lines li { padding: 4px 0; border-top: 1px dashed var(--line); }
.lines li .tg { display: inline-block; min-width: 5.5em; font-weight: 600; color: var(--dim); }
.lines li.con .tg { color: var(--con); } .lines li.cex .tg { color: var(--bad); } .lines li.ms .tg { color: var(--ms); }
.lines li .tm { color: var(--faint); font-family: var(--mono); font-size: 12px; margin-right: 6px; }
.lines.hidechk li.chk, .lines.hidechk li.map, .lines.hidechk li.frames { display: none; }
.evt { color: var(--ms); font-weight: 600; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--dim); }

@media (max-width: 1100px) {
  .paperwrap { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 860px) {
  .hero, .rp { grid-template-columns: 1fr; }
  .hero { grid-template-areas: "text" "stats" "fig"; }
  .hero .h-fig { width: 100%; }
  h1 { font-size: 29px; }
  .paper { font-size: 16.5px; }
}
